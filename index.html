<style>
/* VOICE: delicado como o convite (laço rosé, script, serifa espaçada); prático no admin e na portaria.
   IDEA: o próprio convite impresso continua na tela e vira formulário; admin e portaria são cartões de papel com o laço no canto.
   PICTURE: a arte do convite no topo do convidado; o laço recortado do convite nas outras telas.
   COLOUR/TYPE: branco-rosado, rosé #b2476e dos textos do convite, rosa-claro do laço; Great Vibes, Cormorant Garamond, Inter.
   LAYOUT: coluna única no convidado; abas e tabelas que viram cartões no celular. */
:root{--p:#b2476e;--p2:#8f2f55;--rosa:#f6c9d6;--blush:#fbeef2;--bg:#fff8fa;--card:#fff;--ink:#3a2030;--mut:#8a6b78;--line:#f0dde4;--ok:#2f7d5b;--err:#b3261e}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;background:linear-gradient(180deg,#fff 0,var(--bg) 380px,var(--blush) 100%);min-height:100vh}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance;font-weight:500}
.script{font-family:'Great Vibes',cursive;font-weight:400;color:var(--p)}
.caps{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--p2)}
.wrap{max-width:620px;margin:0 auto;padding:18px 16px 70px;position:relative}
.wide{max-width:1120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 12px 34px rgba(178,71,110,.07)}
.arte{display:block;width:100%;height:auto;border-radius:24px;box-shadow:0 16px 40px rgba(178,71,110,.16)}
.det{display:grid;gap:12px;margin-top:14px}
.det div{display:grid;grid-template-columns:7.2em 1fr;gap:10px}
.det b{font-family:'Cormorant Garamond',serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:var(--p2);padding-top:2px}
.det a{color:var(--p)}
.laco-d{display:block;width:64px;height:auto;margin:18px auto 6px}
.aviso{margin:16px 0;padding:14px 18px;border-radius:16px;background:#fff;border:1px solid var(--rosa);font-size:15px}
.aviso.fim{background:#fff3f5;border-color:#f1b7c3}
.aviso.hoje{background:#fff;border:2px solid var(--p)}
label.t{display:block;font-weight:500;margin:18px 0 6px}
.hint{color:var(--mut);font-size:14px;margin-top:5px}
input[type=text],input[type=tel],input[type=password],input[type=date],input[type=time],input[type=search],input[type=url],textarea,select{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid #e8cdd7;border-radius:14px;background:#fff;color:var(--ink);min-height:48px}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:3px solid rgba(178,71,110,.22);border-color:var(--p)}
button:focus-visible,a:focus-visible{outline:3px solid rgba(178,71,110,.35);outline-offset:2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt,.chip{position:relative}
.opt input,.chip input{position:absolute;opacity:0;inset:0}
.opt span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:54px;padding:10px;border:1.5px solid #e8cdd7;border-radius:14px;font-weight:500;cursor:pointer;background:#fff}
.opt input:checked+span{border-color:var(--p);background:var(--blush);color:var(--p2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip span{display:inline-flex;align-items:center;min-height:44px;padding:8px 15px;border:1.5px solid #e8cdd7;border-radius:999px;cursor:pointer;background:#fff;font-size:15px}
.chip input:checked+span{border-color:var(--p);background:var(--p);color:#fff}
.opt input:focus-visible+span,.chip input:focus-visible+span{outline:3px solid rgba(178,71,110,.35)}
.step{display:flex;align-items:center;gap:12px}
.step button{width:48px;height:48px;border-radius:50%;font-size:22px;padding:0}
.step output{min-width:34px;text-align:center;font-size:24px;font-weight:600;color:var(--p2)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:14px;padding:12px 20px;min-height:48px;cursor:pointer;background:var(--p);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
button:hover,.btn:hover{background:var(--p2)}
button.sec,.btn.sec{background:#fff;color:var(--p);border:1.5px solid var(--p)}
button.sec:hover,.btn.sec:hover{background:var(--blush)}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
button.peq,.btn.peq{min-height:38px;padding:7px 13px;font-size:14px;border-radius:11px}
button.perigo{background:var(--err)}
button:disabled,.btn.off{opacity:.5;pointer-events:none}
.full{width:100%}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:15px}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--p);flex:none}
.msg{margin-top:12px;font-weight:500}.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.done{text-align:center;padding:30px 22px}
.done h2{font-size:clamp(44px,12vw,58px)}
/* admin e portaria */
.papel{position:relative;padding-top:6px}
.papel::before{content:"";position:absolute;top:-18px;left:-16px;width:clamp(80px,13vw,150px);aspect-ratio:250/721;background:url(/laco.jpg) top left/contain no-repeat;mix-blend-mode:multiply;opacity:.75;pointer-events:none;z-index:0;-webkit-mask-image:radial-gradient(130% 70% at 0 0,#000 50%,transparent 100%);mask-image:radial-gradient(130% 70% at 0 0,#000 50%,transparent 100%)}
.papel>*{position:relative;z-index:1}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 18px;padding-left:clamp(58px,10vw,130px);min-height:92px}
.top h1{font-size:clamp(40px,7vw,56px)}
.top .caps{font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.tabs button{flex:none;background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
.tabs button[aria-selected=true]{background:var(--p);color:#fff;border-color:var(--p)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.kpi b{display:block;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(36px,6vw,48px);line-height:1;color:var(--p);font-variant-numeric:tabular-nums}
.kpi span{color:var(--mut);font-size:14px}
.bar{height:8px;background:var(--blush);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--p)}
table{width:100%;border-collapse:collapse;background:#fff;font-size:15px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mut);font-size:13px;background:#fffafb}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px;white-space:nowrap}
.tag.p{background:#e7f4ee;color:var(--ok)}.tag.a{background:#fff1dd;color:#8a5a00}.tag.x{background:#f3eef0;color:var(--mut)}.tag.d{background:#f6e6ee;color:var(--p2)}
.alg{color:var(--err);font-weight:500}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input{flex:1 1 220px}
.box{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
.pess{display:grid;gap:10px}
.pp{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.pp.ok{border-color:#b9e0cc;background:#f4fbf7}
.pp h3{font-size:18px;font-weight:600}
.pp p{margin:2px 0 0;color:var(--mut);font-size:14px}
.pp button{flex:none;min-width:118px}
.pp.ok button{background:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(58,32,48,.42);display:flex;align-items:flex-end;justify-content:center;z-index:9;padding:12px}
.modal .card{width:100%;max-width:560px;max-height:92vh;overflow:auto}
@media(min-width:600px){.modal{align-items:center}}
.code{font-family:ui-monospace,Menlo,monospace;font-size:28px;letter-spacing:.14em;background:var(--blush);border:1px dashed var(--p);border-radius:14px;padding:12px;text-align:center;color:var(--p2)}
.copy{display:flex;gap:8px}.copy input{flex:1}
.sec-t{font-size:40px;margin:28px 0 8px}
.avs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.av h3{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:22px;color:var(--p2)}
.av .quando{font-size:14px;color:var(--mut);margin:2px 0 8px}
.av.hoje{border:2px solid var(--p)}
.muted{color:var(--mut)}
.load{padding:80px 0;text-align:center;color:var(--mut)}
.load img{width:80px;mix-blend-mode:multiply;display:block;margin:0 auto 10px}
@media(max-width:600px){
 .row,.opts{grid-template-columns:1fr}
 table{font-size:14px}
 .stack thead{display:none}.stack tr{display:grid;padding:10px 12px;border-bottom:1px solid var(--line)}
 .stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em;text-align:start}
 .stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mut);font-size:13px}
 .stack td:empty{display:none}
 .top{padding-left:62px}
}
@media (prefers-reduced-motion:no-preference){
 .pp,.opt span,.chip span,button{transition:background .15s,border-color .15s}
 .arte{animation:surge .7s ease-out both}
 @keyframes surge{from{opacity:0;transform:translateY(10px)}}
}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<main id="app" class="wrap"><div class="load"><img src="/lacinho.png" alt="">Carregando…</div></main>

<script>
{
const ROTA = location.pathname.replace(/\/+$/, '').split('/').pop();
const PAG = ROTA === 'admin' ? 'admin' : ROTA === 'portaria' ? 'portaria' : 'convite';
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const AUSENCIA = 'Olá! Este número da EMPREZIONI é usado apenas para enviar avisos e não recebe respostas. Obrigada pela compreensão! 🎀';
let CFG = {};

/* ---------- utilidades ---------- */
const memo = {};
const store = {
  get(k){ try { return localStorage.getItem(k) || memo[k] || ''; } catch(e){ return memo[k] || ''; } },
  set(k,v){ memo[k] = v; try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ delete memo[k]; try { localStorage.removeItem(k); } catch(e){} }
};
const tkKey = 'aniv_ayarla_tk_' + PAG;
const token = () => store.get(tkKey);

async function call(acao, dados){
  let r;
  try {
    const res = await fetch('/api', { method:'POST', headers:{'content-type':'application/json', authorization:'Bearer '+token()}, body: JSON.stringify({ acao, dados: dados || {} }) });
    r = await res.json();
  } catch(e){ throw new Error('Sem conexão. Verifique a internet e tente de novo.'); }
  if (r && r.ok) return r.data;
  if (r && r.erro === 'SESSAO') store.del(tkKey);
  const e = new Error((r && r.msg) || 'Algo deu errado. Tente de novo.'); e.code = r && r.erro; throw e;
}
function dataLonga(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); if (!m) return '';
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return DIAS[d.getDay()] + ', ' + (+m[3]) + ' de ' + MESES[+m[2]-1];
}
function dataCurta(iso){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? m[3]+'/'+m[2] : ''; }
function link(u, txt, cls){ return /^https:\/\//.test(u||'') ? '<a '+(cls?'class="'+cls+'" ':'')+'href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(txt||'Abrir')+'</a>' : ''; }
function opcoesAlergia(){ return String(CFG.alergiasOpcoes||'').split(',').map(s=>s.trim()).filter(Boolean); }
function pessoas(n, s, p){ n = +n||0; return n + ' ' + (n===1 ? s : p); }
function setMsg(el, txt, tipo){ el.textContent = txt; el.className = 'msg ' + (tipo||''); }
function copiar(inp, btn){
  const ok = () => { const t = btn.textContent; btn.textContent = 'Copiado'; setTimeout(()=>btn.textContent=t,1600); };
  inp.select();
  try { navigator.clipboard.writeText(inp.value).then(ok, () => { document.execCommand('copy'); ok(); }); }
  catch(e){ try { document.execCommand('copy'); ok(); } catch(_){} }
}
function modal(html){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="card" role="dialog" aria-modal="true">'+html+'</div>';
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-fechar]')) m.remove(); });
  document.addEventListener('keydown', function f(e){ if (e.key === 'Escape') { m.remove(); document.removeEventListener('keydown', f); } });
  document.body.appendChild(m); const f = m.querySelector('input,textarea,select,button'); if (f) f.focus();
  return m;
}
function confirma(texto, rotulo){
  return new Promise(res => {
    const m = modal('<p style="margin-top:0">'+esc(texto)+'</p><div class="tools" style="justify-content:flex-end;margin:0"><button class="ghost" data-fechar>Cancelar</button><button class="perigo" id="sim">'+esc(rotulo||'Confirmar')+'</button></div>');
    m.querySelector('#sim').onclick = () => { m.remove(); res(true); };
    m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-fechar]')) res(false); });
  });
}
function stepper(nome, val, min){
  return '<div class="step" data-step="'+nome+'" data-min="'+min+'"><button type="button" class="sec" data-d="-1" aria-label="Diminuir">−</button><output id="'+nome+'">'+val+'</output><button type="button" class="sec" data-d="1" aria-label="Aumentar">+</button></div>';
}
function ligaSteppers(root){
  root.querySelectorAll('[data-step]').forEach(s => s.addEventListener('click', e => {
    const b = e.target.closest('button[data-d]'); if (!b) return;
    const o = s.querySelector('output'); o.textContent = Math.max(+s.dataset.min, Math.min(30, (+o.textContent) + (+b.dataset.d)));
    s.dispatchEvent(new Event('change', {bubbles:true}));
  }));
}

/* ======================= CONVITE (convidado) ======================= */
async function convite(){
  const info = await call('info');
  CFG = info.cfg;
  let salvo = null; try { salvo = JSON.parse(store.get('aniv_ayarla_resp') || 'null'); } catch(e){}
  formConvite(info, salvo);
}

function cabecalho(info){
  const c = info.cfg;
  const linhas = [
    c.data && ['Quando', esc(dataLonga(c.data)) + (c.hora ? ', às ' + esc(c.hora.replace(':00','h').replace(':','h')) : '')],
    c.local && ['Onde', esc(c.local) + (c.endereco ? '<br><span class="muted">'+esc(c.endereco)+'</span>' : '') + (c.mapa ? '<br>'+link(c.mapa,'Ver no mapa') : '')],
    c.traje && ['Dress code', esc(c.traje)],
    (c.presente || c.presenteDetalhe) && ['Presente', esc(c.presente) + (c.presenteDetalhe ? (c.presente ? '<br>' : '') + '<span style="opacity:.6">'+esc(c.presenteDetalhe)+'</span>' : '')]
  ].filter(Boolean);
  return '<img class="arte" src="/convite.jpg" width="900" height="1248" alt="Convite: Aniversário de Ayarla Souza, 28 anos. Venha celebrar comigo este dia tão especial! 03 de dezembro de 2026, às 18 horas, no Salão de Festa, Av. Atlântica s/n, Terras Alphaville 2, Eusébio-CE. Dress code: branco, off white, bege ou nude.">'
    + (linhas.length ? '<div class="card det" style="margin-top:16px">'+linhas.map(l=>'<div><b>'+l[0]+'</b><span>'+l[1]+'</span></div>').join('')+'</div>' : '');
}

function formConvite(info, v){
  const c = info.cfg; v = v || {};
  const prazo = c.prazo ? dataCurta(c.prazo) : '';
  const falta = diasEntre(info.hoje, c.data);
  const contagem = falta >= 0 ? '<p class="script" style="text-align:center;font-size:clamp(40px,11vw,52px);margin:18px 0 0">'+esc(faltamTxt(falta))+(falta > 0 ? '!' : '!')+'</p>' : '';
  const aviso = contagem + (info.encerrado
    ? '<div class="aviso fim">O prazo de confirmação terminou'+(prazo?' em '+prazo:'')+'. Você ainda pode responder: sua confirmação entra na <b>lista de confirmação adicional</b> e a '+esc(c.aniversariante.split(' ')[0])+' confirma com você.</div>'
    : (prazo ? '<div class="aviso">Confirme sua presença até <b>'+esc(dataLonga(c.prazo))+'</b>.</div>' : ''));
  const crian = c.criancas !== 'nao';
  const marc = v.alergias || [];
  app.innerHTML = cabecalho(info) + aviso
    + '<form class="card" id="f" novalidate>'
    + '<img class="laco-d" src="/lacinho.png" alt="" style="margin-top:0">'
    + '<h2 class="script" style="font-size:clamp(46px,12vw,60px);text-align:center">Confirme sua presença</h2>'
    + '<label class="t" for="nome">Seu nome completo</label><input type="text" id="nome" autocomplete="name" maxlength="80" value="'+esc(v.nome)+'">'
    + '<label class="t" for="zap">Seu WhatsApp (com DDD)</label><input type="tel" id="zap" inputmode="tel" autocomplete="tel" placeholder="(85) 99999-9999" value="'+esc(v.whatsapp)+'">'
    + '<label class="t">Você vai?</label><div class="opts" role="radiogroup" aria-label="Você vai?">'
    + '<label class="opt"><input type="radio" name="vai" value="sim" '+(v.vai!=='nao'?'checked':'')+'><span>Sim, eu vou!</span></label>'
    + '<label class="opt"><input type="radio" name="vai" value="nao" '+(v.vai==='nao'?'checked':'')+'><span>Não poderei ir</span></label></div>'
    + '<div id="blocoSim">'
    + '<div class="row"><div><label class="t">Adultos (contando você)</label>'+stepper('adultos', v.adultos||1, 1)+'</div>'
    + (crian ? '<div><label class="t">Crianças</label>'+stepper('criancas', v.criancas||0, 0)+'</div>' : '')+'</div>'
    + (crian ? '<div id="blocoIdades" hidden><label class="t" for="idades">Idade de cada criança</label><input type="text" id="idades" maxlength="120" placeholder="Ex.: 3 e 7 anos" value="'+esc(v.idadesCriancas)+'"></div>' : '')
    + '<label class="t">Alguém do seu grupo tem alergia ou restrição alimentar?</label>'
    + '<div class="chips" id="algs">' + opcoesAlergia().concat(['Nenhuma']).map(a => '<label class="chip"><input type="checkbox" value="'+esc(a)+'" '+(marc.indexOf(a)>=0?'checked':'')+'><span>'+esc(a)+'</span></label>').join('') + '</div>'
    + '<label class="t" for="outra">Outra alergia ou detalhe</label><input type="text" id="outra" maxlength="200" placeholder="Ex.: alergia a camarão (filho, 7 anos)" value="'+esc(v.alergiaOutra)+'">'
    + '<div class="hint">Assim o cardápio fica seguro para todo mundo.</div>'
    + '</div>'
    + '<label class="t" for="obs">Recado para a aniversariante (opcional)</label><textarea id="obs" maxlength="400">'+esc(v.observacoes)+'</textarea>'
    + '<label class="check" id="lbAv"><input type="checkbox" id="avisos" '+(v.aceitaAvisos!==false?'checked':'')+'><span>Quero receber pelo WhatsApp os avisos do aniversário: cadastro na portaria do condomínio, lembrete e informações do dia.'+(c.whatsappAvisos?'<br><span class="muted" style="font-size:14px">Para receber, salve nos seus contatos o número <b>'+esc(fmtZap(c.whatsappAvisos))+'</b>.</span>':'')+'</span></label>'
    + '<button class="full" style="margin-top:22px" id="enviar">Enviar resposta</button><div class="msg" id="m" role="status"></div>'
    + '</form>';

  const f = document.getElementById('f');
  ligaSteppers(f);
  const atual = () => f.querySelector('input[name=vai]:checked').value;
  const sync = () => {
    const sim = atual() === 'sim';

    document.getElementById('lbAv').hidden = !sim;

      if (e.target.value === 'Nenhuma') boxes.forEach(b => { if (b !== e.target) b.checked = false; });
      else boxes.forEach(b => { if (b.value === 'Nenhuma') b.checked = false; });
    }
    sync();
  });
  sync();
  f.addEventListener('submit', async e => {
    e.preventDefault();

      alergiaOutra: document.getElementById('outra').value.trim(),
      observacoes: f.obs.value.trim(), aceitaAvisos: sim && document.getElementById('avisos').checked
    };
    if (d.nome.length < 2) return setMsg(m, 'Escreva seu nome.', 'err');
    if (d.whatsapp.replace(/\D/g,'').length < 10) return setMsg(m, 'Escreva seu WhatsApp com DDD.', 'err');
    if (sim && nCri && !d.idadesCriancas) return setMsg(m, 'Informe a idade de cada criança.', 'err');
    if (sim && !d.alergias.length && !d.alergiaOutra) return setMsg(m, 'Marque as alergias do grupo ou "Nenhuma".', 'err');
    b.disabled = true; setMsg(m, 'Enviando…');
    try {

      store.set('aniv_ayarla_resp', JSON.stringify(d));
      obrigado(info, r);
      window.scrollTo({ top: 0 });

  });
}

  else { t = 'Presença confirmada!'; s = pn + ', que alegria! A '+an+' conta com você ' + (c.data ? 'na '+esc(dataLonga(c.data)) : '') + (c.hora ? ', às '+esc(c.hora.replace(':00','h')) : '') + '.'; }
  const cond = r.linkCondominio ? '<div class="aviso hoje" style="text-align:left"><b>Cadastro na portaria do condomínio</b><br>Para entrar no dia, faça o cadastro de todos que vão com você.<div style="margin-top:10px">'+link(r.linkCondominio,'Fazer cadastro agora','btn full')+'</div></div>' : '';

    + (r.vai === 'sim' && !r.linkCondominio && r.lista === 'principal' ? '<p class="muted" style="font-size:15px">Perto da data você recebe pelo WhatsApp o link para o cadastro na portaria do condomínio.'+(c.whatsappAvisos?' Salve o número <b>'+esc(fmtZap(c.whatsappAvisos))+'</b> nos seus contatos para receber.':'')+'</p>' : '')
    + cond + '<button class="sec" id="alt" style="margin-top:8px">Alterar minha resposta</button></div>';
  document.getElementById('alt').onclick = () => {

function totais(lst){
  const t = { sim:0, nao:0, adultos:0, criancas:0, ad:0, adP:0, porta:0, portaP:0, chegaram:0 };
  lst.forEach(g => {
    const p = (+g.adultos||0) + (+g.criancas||0);
    if (g.vai === 'nao') { t.nao++; return; }
    if (g.lista === 'principal') { t.sim++; t.adultos += +g.adultos||0; t.criancas += +g.criancas||0; }
    if (g.lista === 'adicional') { t.ad++; t.adP += p; }
    if (g.lista === 'porta') { t.porta++; t.portaP += p; }
    if (g.checkin === 'sim') t.chegaram += p;
  });
  return t;
}
function resumoAlergias(lst){
  const m = {};
  lst.filter(g => g.vai === 'sim').forEach(g => {
    String(g.alergias||'').split(';').map(s=>s.trim()).filter(a => a && a !== 'Nenhuma').forEach(a => (m[a] = m[a] || []).push(g.nome));
    if (g.alergiaOutra) (m['Outras (detalhadas)'] = m['Outras (detalhadas)'] || []).push(g.nome + ': ' + g.alergiaOutra);
  });
  return m;
}

function diasEntre(a, b){
  const p = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m ? Date.UTC(+m[1], +m[2]-1, +m[3]) : NaN; };
  return Math.round((p(b) - p(a)) / 86400000);
}
function faltamTxt(n){ return isNaN(n) ? '' : n <= 0 ? 'É hoje' : n === 1 ? 'Falta 1 dia' : 'Faltam ' + n + ' dias'; }
function preenche(tpl, ref){
  const c = CFG;
  const rep = { nome: '', data: dataLonga(c.data), hora: (c.hora||'').replace(':00','h'), local: c.local, endereco: c.endereco, mapa: c.mapa,
    aniversariante: String(c.aniversariante||'').split(' ')[0], traje: c.traje, linkCondominio: c.linkCondominio || '[link do condomínio]',
    prazo: dataCurta(c.prazo), faltam: faltamTxt(diasEntre(ref, c.data)) };
  const corpo = String(tpl||'').replace(/\{(\w+)\}/g, (x,k) => k in rep ? (rep[k]||'') : x).replace(/ +([!,.])/g,'$1').replace(/\n{3,}/g,'\n\n').trim();
  return corpo + (c.rodape ? '\n\n' + c.rodape : '');
}

        const dt = CFG[av.data], env = CFG[av.k], n = diasEntre(hoje, dt);
        const status = env ? '<span class="tag p">Enviado em '+esc(env.slice(0,5))+'</span>'
          : !dt ? '<span class="tag x">sem data</span>'
          : n > 0 ? '<span class="tag x">enviar em '+esc(dataCurta(dt))+' ('+(n===1?'amanhã':'daqui a '+n+' dias')+')</span>'
          : n === 0 ? '<span class="tag a">enviar hoje</span>' : '<span class="tag a">atrasado</span>';
        const trava = av.msg === 'msgCond' && !CFG.linkCondominio;
        return '<div class="card av'+(n===0&&!env?' hoje':'')+'"><h3>'+esc(av.nome)+'</h3><div class="quando">'+esc(dataLonga(dt))+' · '+status+'</div>'
          + '<textarea readonly rows="9" id="pv_'+av.msg+'" style="background:#fffafb">'+esc(preenche(CFG[av.msg], dt))+'</textarea>'
          + (trava ? '<p class="alg" style="font-size:14px;margin:6px 0 0">Coloque o link do condomínio na aba Evento antes de enviar.</p>' : '')
          + '<div class="tools" style="margin:10px 0 0"><button class="peq" data-cp="pv_'+av.msg+'"'+(trava?' disabled':'')+'>Copiar mensagem</button>'
          + (env ? '<button class="ghost peq" data-env="'+av.k+'" data-v="">Desmarcar</button>' : '<button class="sec peq" data-env="'+av.k+'" data-v="1"'+(trava?' disabled':'')+'>Marcar como enviado</button>') + '</div>'
          + '<details style="margin-top:10px"><summary class="muted" style="cursor:pointer;font-size:14px">Editar texto</summary><textarea id="msg_'+av.msg+'" rows="7" style="margin-top:8px">'+esc(CFG[av.msg])+'</textarea><button class="sec peq" data-salva="'+av.msg+'" style="margin-top:8px">Salvar texto</button></details></div>';
      }).join('') + '</div>'
    + '<p class="muted" style="font-size:14px">No texto, {faltam} vira "Faltam 4 dias" conforme a data do aviso. Outras variáveis: {data}, {hora}, {local}, {endereco}, {mapa}, {traje}, {linkCondominio}, {aniversariante}.</p>'
    + '<h2 class="sec-t script">Lista de transmissão</h2>'
    + '<div class="card"><p style="margin-top:0">No WhatsApp: <b>⋮ / Configurações → Listas de transmissão → Nova lista</b> e adicione os confirmados abaixo. Quem confirmar depois aparece aqui como <b>novo</b> para você incluir.</p>'
    + '<div class="aviso" style="margin:0 0 14px">Atenção: no WhatsApp, a lista de transmissão só entrega a mensagem para quem tem o número de quem envia <b>salvo nos contatos</b>. Por isso a página de confirmação pede para os convidados salvarem o número '+esc(fmtZap(CFG.whatsappAvisos))+'.</div>'
    + '<div class="kpis" style="margin-bottom:14px"><div class="kpi"><b>'+(alvo.length - fora.length)+'</b><span>já estão na lista</span></div><div class="kpi"><b>'+fora.length+'</b><span>novos para adicionar</span></div></div>'
    + (fora.length ? '<div class="tools"><button class="sec peq" data-cp="nums">Copiar números dos novos</button><button class="peq" id="todosLista">Marcar todos como adicionados</button></div><textarea id="nums" style="position:absolute;left:-9999px" aria-hidden="true">'+esc(fora.map(g=>g.nome+' — +'+g.whatsapp).join('\n'))+'</textarea>' : '')
    + (alvo.length ? '<div class="box"><table class="stack"><thead><tr><th>Convidado</th><th>WhatsApp</th><th>Lista de transmissão</th></tr></thead><tbody>'
      + alvo.sort((a,b)=>(!!a.naLista)-(!!b.naLista)).map(g => '<tr><td><b>'+esc(g.nome)+'</b> '+tagLista(g)+'</td><td style="white-space:nowrap">'+esc(fmtZap(g.whatsapp))+'</td><td>'
        + (g.naLista ? '<span class="tag p">Adicionado</span> <button class="ghost peq" data-li="'+esc(g.id)+'" data-v="">Desfazer</button>' : '<span class="tag a">Novo</span> <button class="sec peq" data-li="'+esc(g.id)+'" data-v="1">Já adicionei</button>')
        + '</td></tr>').join('') + '</tbody></table></div>' : '<p class="muted">Ainda não há confirmados que aceitaram receber avisos.</p>')
    + (A.convidados.filter(g=>g.vai==='sim'&&g.whatsapp&&g.aceitaAvisos!=='sim').length ? '<p class="muted" style="font-size:14px">'+A.convidados.filter(g=>g.vai==='sim'&&g.whatsapp&&g.aceitaAvisos!=='sim').length+' confirmado(s) preferiram não receber avisos e não aparecem aqui.</p>' : '')
    + '</div>'
    + '<h2 class="sec-t script">Mensagem de ausência</h2><div class="card"><p style="margin-top:0">Para o número só enviar avisos: no WhatsApp Business, <b>Ferramentas comerciais → Mensagem de ausência → ativar → Programar: Sempre enviar</b>, com este texto:</p>'
    + '<div class="copy"><input type="text" readonly id="aus" value="'+esc(AUSENCIA)+'"><button class="sec peq" data-cp="aus">Copiar</button></div>'
    + '<p class="muted" style="font-size:14px;margin-bottom:0">O WhatsApp não permite bloquear respostas; esta mensagem responde automaticamente quem escrever.</p></div>';
  el.addEventListener('click', async e => {
    const cp = e.target.closest('[data-cp]'); if (cp) return copiar(document.getElementById(cp.dataset.cp), cp);
    if (e.target.id === 'ics') return baixarIcs();
    const en = e.target.closest('[data-env]'), sv = e.target.closest('[data-salva]'), li = e.target.closest('[data-li]');
    try {
      if (en) { en.disabled = true; await call('salvarConfig', { [en.dataset.env]: en.dataset.v ? A.hoje.split('-').reverse().join('/') : '' }); await recarrega(); }
      if (sv) { sv.disabled = true; await call('salvarConfig', { [sv.dataset.salva]: document.getElementById('msg_'+sv.dataset.salva).value }); await recarrega(); }
      if (li) { li.disabled = true; await call('marcarAviso', { ids: [li.dataset.li], qual: 'naLista', valor: !!li.dataset.v }); await recarrega(); }
      if (e.target.id === 'todosLista') { e.target.disabled = true; await call('marcarAviso', { ids: fora.map(g=>g.id), qual: 'naLista', valor: true }); await recarrega(); }
    } catch(err){ alertaErro(err); }
  });
}
function alertaErro(err){ modal('<p style="margin-top:0">'+esc(err.message)+'</p><div class="tools" style="justify-content:flex-end;margin:0"><button data-fechar>Ok</button></div>'); }
function baixarIcs(){
  const u = location.origin + '/admin', d = s => String(s||'').replace(/-/g,'');
  const linhas = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Aniversario Ayarla//PT','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VTIMEZONE','TZID:America/Fortaleza','BEGIN:STANDARD','DTSTART:19700101T000000','TZOFFSETFROM:-0300','TZOFFSETTO:-0300','END:STANDARD','END:VTIMEZONE'];
  const ev = (dt, titulo, desc, hora) => {
    if (!dt) return;
    const ini = d(dt) + 'T' + hora + '00', fim = d(dt) + 'T' + hora.slice(0,2) + '3000';
    linhas.push('BEGIN:VEVENT','UID:'+d(dt)+'-'+titulo.replace(/\W/g,'').slice(0,20)+'@aniversario-ayarla','DTSTAMP:20261124T120000Z',
      'DTSTART;TZID=America/Fortaleza:'+ini,'DTEND;TZID=America/Fortaleza:'+fim,'SUMMARY:'+titulo,'DESCRIPTION:'+desc.replace(/\n/g,'\\n').replace(/,/g,'\\,'),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+titulo,'TRIGGER:PT0M','END:VALARM','END:VEVENT');
  };
  AVISOS.forEach(av => ev(CFG[av.data], 'Enviar aviso: ' + av.curto.replace(/"/g,''), 'Abra '+u+' → Avisos WhatsApp → Copiar mensagem → cole na lista de transmissão.', '0900'));
  ev(CFG.prazo, 'Último dia de confirmação de presença', 'Depois de hoje, quem confirmar vai para a lista adicional. Painel: '+u, '1800');
  linhas.push('END:VCALENDAR');
  const blob = new Blob([linhas.join('\r\n')], { type: 'text/calendar' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'lembretes-aniversario-ayarla.ics';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function abaEvento(el){
  const c = CFG;
  const campo = (k, rot, tipo, extra) => '<div><label class="t" for="c_'+k+'">'+rot+'</label><input type="'+(tipo||'text')+'" id="c_'+k+'" name="'+k+'" value="'+esc(c[k])+'" '+(extra||'')+'></div>';
  el.innerHTML = '<form class="card" id="cf"><p class="muted" style="margin-top:0">Estas informações aparecem para os convidados e nas mensagens de WhatsApp.</p>'
    + campo('linkCondominio','Link de cadastro na portaria do condomínio (https://…)','url','placeholder="Cole aqui o link que o condomínio enviou"')
    + '<div class="row">'+campo('aniversariante','Nome da aniversariante')+campo('titulo','Título do painel')+'</div>'
    + '<div class="row">'+campo('data','Data da festa','date')+campo('hora','Horário','time')+'</div>'
    + '<div class="row">'+campo('prazo','Confirmações até (inclusive)','date')+'<div><label class="t" for="c_criancas">Crianças são convidadas?</label><select id="c_criancas" name="criancas"><option value="sim">Sim</option><option value="nao" '+(c.criancas==='nao'?'selected':'')+'>Não</option></select></div></div>'
    + campo('local','Nome do local') + campo('endereco','Endereço completo') + campo('mapa','Link do mapa (https://…)','url')
    + '<div class="row">'+campo('traje','Dress code')+campo('presente','Sugestão de presente')+'</div>'
    + '<h3 class="caps" style="font-size:14px;margin:26px 0 0">Datas dos avisos</h3>'
    + '<div class="row">'+campo('dataAvisoCond','Cadastro do condomínio','date')+campo('dataAviso1','"Tá chegando"','date')+'</div>'
    + '<div class="row">'+campo('dataAviso2','"Vem comemorar comigo"','date')+campo('whatsappAvisos','WhatsApp que envia os avisos','tel')+'</div>'
    + campo('rodape','Frase no fim de todas as mensagens')
    + campo('presenteDetalhe','Detalhe do presente (aparece mais clarinho)')
    + campo('alergiasOpcoes','Opções de alergia (separe por vírgula)')
    + '<button style="margin-top:22px">Salvar informações</button><div class="msg" id="cm"></div></form>';
  const f = document.getElementById('cf');
  f.addEventListener('submit', async e => {
    e.preventDefault(); const d = {};
    [...f.elements].forEach(i => { if (i.name) d[i.name] = i.value.trim(); });
    const bt = f.querySelector('button'); bt.disabled = true;
    try { await call('salvarConfig', d); await recarrega(); } catch(err){ setMsg(document.getElementById('cm'), err.message, 'err'); bt.disabled = false; }
  });
}

function abaAcessos(el){
  const u = location.origin;
  const lk = (rot, val, id, desc) => '<div class="card" style="margin-bottom:12px"><b>'+rot+'</b><div class="muted" style="font-size:14px;margin:2px 0 8px">'+desc+'</div><div class="copy"><input type="text" readonly id="'+id+'" value="'+esc(val)+'"><button class="sec peq" data-cp="'+id+'">Copiar</button></div></div>';
  const convite = 'Oi! Vou comemorar meu aniversário e quero muito você lá! 🎀\nConfirme sua presença até '+dataCurta(CFG.prazo)+' por este link:\n'+u+'/';
  el.innerHTML = lk('Link para os convidados', u + '/', 'l1', 'É este que vai no WhatsApp para confirmação.')
    + '<div class="card" style="margin-bottom:12px"><b>Mensagem pronta com o link</b><div class="muted" style="font-size:14px;margin:2px 0 8px">Para a Ayarla mandar aos convidados, ou divulgar em grupos.</div><textarea id="l0" rows="4">'+esc(convite)+'</textarea><button class="sec peq" data-cp="l0" style="margin-top:8px">Copiar</button></div>'
    + lk('Link do admin', u + '/admin', 'l2', 'Entra com a senha uma vez em cada aparelho.')
    + lk('Link da portaria', u + '/portaria', 'l3', 'Para quem confere a entrada: consulta, chegada e registro de quem chegou sem confirmar.')
    + '<div class="card" style="margin-bottom:12px"><b>Código da portaria</b><p class="muted" style="font-size:14px;margin:2px 0 10px">'+(A.portariaAtiva?'Há um código ativo. Gerar outro desconecta quem estiver usando o anterior.':'Nenhum código ativo.')+'</p><div id="cod"></div>'
    + '<div class="tools" style="margin:0"><button id="gerar">'+(A.portariaAtiva?'Gerar novo código':'Gerar código')+'</button>'+(A.portariaAtiva?'<button class="ghost" id="desat">Desativar portaria</button>':'')+'</div></div>'
    + '<form class="card" id="ts"><b>Trocar senha do admin</b><div class="row"><div><label class="t">Senha atual</label><input type="password" name="atual" autocomplete="current-password"></div><div><label class="t">Nova senha</label><input type="password" name="nova" autocomplete="new-password"></div></div><button class="sec" style="margin-top:14px">Trocar senha</button><div class="msg" id="tm"></div></form>'
    + '<div class="tools" style="margin-top:16px"><button class="ghost" id="sair">Sair deste aparelho</button></div>';
  el.addEventListener('click', async e => {
    const cp = e.target.closest('[data-cp]'); if (cp) return copiar(document.getElementById(cp.dataset.cp), cp);
    if (e.target.id === 'gerar') {
      e.target.disabled = true;
      try {
        const r = await call('gerarConsulta'); A.portariaAtiva = true;
        document.getElementById('cod').innerHTML = '<div class="code">'+esc(r.codigo)+'</div><p class="muted" style="font-size:14px">Anote agora: o código só aparece esta vez. Envie para a pessoa da portaria junto com o link.</p>'
          + '<div class="copy" style="margin-bottom:12px"><input type="text" readonly id="cmsg" value="'+esc('Portaria do aniversário da Ayarla: '+u+'/portaria — código: '+r.codigo)+'"><button class="sec peq" data-cp="cmsg">Copiar</button></div>';
        e.target.disabled = false; e.target.textContent = 'Gerar novo código';
      } catch(err){ e.target.disabled = false; }
    }
    if (e.target.id === 'desat' && await confirma('Desativar o acesso da portaria? Quem estiver conectado sai na hora.', 'Desativar')) {
      try { await call('revogar', { papel: 'portaria', desativar: true }); await recarrega(); } catch(_){}
    }
    if (e.target.id === 'sair') { store.del(tkKey); iniciar(); }
  });
  document.getElementById('ts').addEventListener('submit', async e => {
    e.preventDefault(); const f = e.target;
    try { const r = await call('trocarSenha', { atual: f.atual.value, nova: f.nova.value }); store.set(tkKey, r.token); f.reset(); setMsg(document.getElementById('tm'), 'Senha trocada. Outros aparelhos foram desconectados.', 'ok'); }
    catch(err){ setMsg(document.getElementById('tm'), err.message, 'err'); }
  });
}

/* =========================== PORTARIA =========================== */
let P = null, abaP = 'conf', buscaP = '', timerP = null;
async function portaria(){
  app.classList.remove('wide');
  if (!token()) return telaLogin('portaria', false);
  try { P = await call('portaria'); }
  catch(e){ if (e.code === 'SESSAO') return telaLogin('portaria', false); throw e; }
  desenhaP();
  clearInterval(timerP);
  timerP = setInterval(async () => {
    if (document.querySelector('.modal') || (document.activeElement && document.activeElement.id === 'pq')) return;
    try { P = await call('portaria'); desenhaP(); } catch(_){}
  }, 30000);
}
function desenhaP(){
  const L = P.convidados;
  const conf = L.filter(g => g.lista === 'principal'), extra = L.filter(g => g.lista !== 'principal');
  const soma = arr => arr.reduce((s,g)=>s+(+g.adultos||0)+(+g.criancas||0),0);
  const cheg = arr => soma(arr.filter(g=>g.checkin==='sim'));
  const q = buscaP.toLowerCase();
  const vis = (abaP === 'conf' ? conf : extra).filter(g => !q || g.nome.toLowerCase().indexOf(q) >= 0)
    .sort((a,b) => (a.checkin===b.checkin ? 0 : a.checkin==='sim' ? 1 : -1) || a.nome.localeCompare(b.nome,'pt'));
  app.innerHTML = '<div class="papel"><div class="top"><div><h1 class="script">Portaria</h1><div class="caps">'+esc(P.titulo)+' · chegaram '+cheg(L)+' pessoas</div></div><button class="ghost peq" id="pr">Atualizar</button></div>'
    + '<div class="kpis" style="margin-bottom:14px"><div class="kpi"><b>'+cheg(conf)+'<span style="font-size:22px"> / '+soma(conf)+'</span></b><span>confirmados que chegaram</span><div class="bar"><i style="width:'+(soma(conf)?Math.round(cheg(conf)/soma(conf)*100):0)+'%"></i></div></div>'
    + '<div class="kpi"><b>'+cheg(extra)+'</b><span>extras que chegaram</span></div></div>'
    + '<nav class="tabs"><button data-p="conf" aria-selected="'+(abaP==='conf')+'">Confirmados ('+conf.length+')</button><button data-p="extra" aria-selected="'+(abaP==='extra')+'">Extras ('+extra.length+')</button></nav>'
    + (abaP==='extra' ? '<p class="muted" style="margin:-6px 0 12px;font-size:14px">Quem confirmou depois do prazo e quem chegou sem confirmar.</p>' : '')
    + '<div class="tools"><input type="search" id="pq" placeholder="Buscar nome" value="'+esc(buscaP)+'">'+(abaP==='extra'?'<button id="nporta">Chegou sem confirmar</button>':'')+'</div>'
    + '<div class="pess">'+(vis.length ? vis.map(g => {
        const ok = g.checkin === 'sim';
        const det = [pessoas(g.adultos,'adulto','adultos'), +g.criancas ? pessoas(g.criancas,'criança','crianças') + (g.idadesCriancas?' ('+esc(g.idadesCriancas)+')':'') : ''].filter(Boolean).join(' · ');
        const alg = [g.alergias && g.alergias!=='Nenhuma' ? g.alergias : '', g.alergiaOutra].filter(Boolean).join(' · ');
        const tg = g.lista==='adicional' ? '<span class="tag a">Confirmou depois</span> ' : g.lista==='porta' ? '<span class="tag d">Sem confirmação</span> ' : '';
        return '<div class="pp'+(ok?' ok':'')+'"><div><h3>'+esc(g.nome)+'</h3><p>'+tg+det+'</p>'+(alg?'<p class="alg">Alergia: '+esc(alg)+'</p>':'')+(g.observacoes?'<p>'+esc(g.observacoes)+'</p>':'')+'</div>'
          + '<button data-ck="'+esc(g.id)+'" data-v="'+(ok?'':'1')+'" aria-pressed="'+ok+'">'+(ok?'Chegou '+esc(String(g.checkinEm).slice(11)):'Marcar chegada')+'</button></div>';
      }).join('') : '<p class="muted">Ninguém nesta lista'+(q?' com esse nome':'')+'.</p>')+'</div>'
    + '<div class="tools" style="margin-top:20px"><button class="ghost peq" id="psair">Sair deste aparelho</button></div></div>';
  const qi = document.getElementById('pq');
  qi.oninput = () => { buscaP = qi.value; const pos = qi.selectionStart; desenhaP(); const n = document.getElementById('pq'); n.focus(); n.setSelectionRange(pos,pos); };
  app.querySelector('nav').onclick = e => { const b = e.target.closest('[data-p]'); if (b) { abaP = b.dataset.p; buscaP = ''; desenhaP(); } };
  document.getElementById('pr').onclick = () => portaria();
  document.getElementById('psair').onclick = () => { store.del(tkKey); clearInterval(timerP); iniciar(); };
  const np = document.getElementById('nporta'); if (np) np.onclick = novoPorta;
  app.querySelector('.pess').onclick = async e => {
    const b = e.target.closest('[data-ck]'); if (!b) return;
    if (!b.dataset.v && !(await confirma('Desmarcar a chegada desta pessoa?', 'Desmarcar'))) return;
    b.disabled = true;
    try { const r = await call('checkin', { id: b.dataset.ck, valor: !!b.dataset.v }); const g = P.convidados.find(x=>x.id===r.id); g.checkin = r.checkin; g.checkinEm = r.checkinEm; desenhaP(); }
    catch(err){ b.disabled = false; b.textContent = 'Tente de novo'; }
  };
}
function novoPorta(){
  const m = modal('<h2 class="script" style="font-size:44px">Chegou sem confirmar</h2><form id="pf">'
    + '<label class="t">Nome</label><input type="text" name="nome" maxlength="80">'
    + '<div class="row"><div><label class="t">Adultos</label>'+stepper('pa',1,0)+'</div><div><label class="t">Crianças</label>'+stepper('pc',0,0)+'</div></div>'
    + '<label class="t">Alergia (se houver)</label><input type="text" name="alergiaOutra">'
    + '<label class="t">Observação</label><input type="text" name="observacoes" placeholder="Ex.: acompanhante de Fulana">'
    + '<div class="tools" style="justify-content:flex-end;margin:20px 0 0"><button type="button" class="ghost" data-fechar>Cancelar</button><button>Registrar chegada</button></div><div class="msg" id="pm"></div></form>');
  const f = m.querySelector('#pf'); ligaSteppers(f);
  f.addEventListener('submit', async e => {
    e.preventDefault(); const bt = f.querySelector('button:not([type])'); bt.disabled = true;
    try {
      const r = await call('registrarPorta', { nome: f.nome.value, adultos: +m.querySelector('#pa').textContent, criancas: +m.querySelector('#pc').textContent, alergiaOutra: f.alergiaOutra.value, observacoes: f.observacoes.value });
      P.convidados.push(r); m.remove(); abaP = 'extra'; desenhaP();
    } catch(err){ setMsg(m.querySelector('#pm'), err.message, 'err'); bt.disabled = false; }
  });
}

/* ============================ INÍCIO ============================ */
function iniciar(){
  app.innerHTML = '<div class="load"><img src="/lacinho.png" alt="">Carregando…</div>';
  const run = PAG === 'admin' ? admin : PAG === 'portaria' ? portaria : convite;
  run().catch(e => { app.innerHTML = '<div class="load"><img src="/lacinho.png" alt="">'+esc(e.message)+'<br><button class="sec" style="margin-top:14px" onclick="location.reload()">Tentar de novo</button></div>'; });
}
iniciar();
}
